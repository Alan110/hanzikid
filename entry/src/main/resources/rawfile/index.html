<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#FFF6E5">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>识字小乐园 🐼</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐼</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 首页 -->
<section class="screen active" id="screen-home">
  <header class="topbar">
    <div class="logo">🐼 识字小乐园</div>
    <button class="icon-btn" id="btnParent" aria-label="家长中心">⚙️</button>
  </header>
  <p class="subtitle">先选一个玩法，再挑一组汉字吧</p>
  <div class="modes">
    <button class="mode-card" data-mode="learn"><span class="big">📖</span>认一认<small>看字卡 · 听发音</small></button>
    <button class="mode-card" data-mode="quiz"><span class="big">🎯</span>找一找<small>听声音 · 找汉字</small></button>
    <button class="mode-card" data-mode="read"><span class="big">🎤</span>读一读<small>跟着读 · 录音评分</small></button>
  </div>
  <div class="group-scroll"><div class="group-grid" id="groupGrid"></div></div>
</section>

<!-- 认一认 -->
<section class="screen" id="screen-learn">
  <header class="topbar">
    <button class="icon-btn" id="learnHome" aria-label="回家">🏠</button>
    <div class="top-title" id="learnTitle">认一认</div>
    <button class="icon-btn" id="btnLearnIcon" aria-label="显示图片提示" title="看图/藏图">🖼️</button>
    <div class="counter" id="learnCounter">1 / 6</div>
  </header>
  <div class="learn-stage">
    <button class="nav-btn" id="learnPrev" aria-label="上一个">‹</button>
    <button class="flash-card kai" id="flashCard">
      <div class="fc-emoji" id="fcEmoji"></div>
      <div class="fc-char kai" id="fcChar"></div>
      <div class="fc-pinyin" id="fcPinyin"></div>
      <div class="fc-word" id="fcWord"></div>
      <div class="fc-tap-hint">👆 点一点，再听一次</div>
    </button>
    <button class="nav-btn" id="learnNext" aria-label="下一个">›</button>
  </div>
</section>

<!-- 找一找 -->
<section class="screen" id="screen-quiz">
  <header class="topbar">
    <button class="icon-btn" id="quizHome" aria-label="回家">🏠</button>
    <div class="mascot" id="mascot">🐼</div>
    <button class="icon-btn" id="btnQuizHints" aria-label="显示图片提示" title="看图提示开/关">🖼️</button>
    <button class="icon-btn" id="btnSkip" aria-label="下一题" title="下一题">⏭️</button>
    <div class="star-count" id="starCount">⭐ 0</div>
  </header>
  <div class="bubble-row">
    <div class="bubble" id="bubbleText">听一听，找出来 👇</div>
    <button class="replay-btn" id="btnReplay">🔊<small>再听一遍</small></button>
  </div>
  <div class="dots" id="dots"></div>
  <div class="options" id="options"></div>
</section>

<!-- 读一读 -->
<section class="screen" id="screen-read">
  <header class="topbar">
    <button class="icon-btn" id="readHome" aria-label="回家">🏠</button>
    <div class="top-title" id="readTitle">🎤 读一读</div>
    <button class="icon-btn" id="btnReadIcon" aria-label="显示图片提示" title="看图/藏图">🖼️</button>
    <button class="icon-btn" id="btnReadSkip" aria-label="下一题" title="下一题">⏭️</button>
    <div class="counter" id="readCounter">1 / 10</div>
  </header>
  <div class="read-stage">
    <div class="read-card" id="readCard">
      <div class="fc-emoji" id="readEmoji"></div>
      <div class="fc-char kai" id="readChar"></div>
      <div class="fc-pinyin" id="readPinyin"></div>
      <div class="fc-word" id="readWord"></div>
      <div class="fc-tap-hint">🎤 大声读出这个字吧</div>
    </div>
  </div>
  <div class="bubble-row">
    <div class="bubble" id="readBubble">这个字怎么读？大声读出来吧</div>
  </div>
  <div class="read-actions">
    <button class="mic-btn" id="btnMic">🎤<small>点我录音</small></button>
  </div>
  <div class="read-feedback hidden" id="readFeedback">
    <div class="rf-card">
      <div class="rf-head" id="rfTitle">这是它的读音 🔈</div>
      <div class="rf-emoji" id="rfEmoji"></div>
      <div class="rf-char kai" id="rfChar"></div>
      <div class="rf-pinyin" id="rfPinyin"></div>
      <div class="rf-word kai" id="rfWord"></div>
      <div class="rf-btns">
        <button class="big-btn primary" id="btnRetry">🔁 再读一次</button>
        <button class="big-btn" id="btnReadNext">⏭️ 下一题</button>
      </div>
    </div>
  </div>
</section>

<!-- 结算 -->
<section class="screen" id="screen-end">
  <div class="end-card">
    <div class="end-emoji" id="endEmoji">🎉</div>
    <h2 id="endTitle">太棒了！</h2>
    <div class="end-stars" id="endStars"></div>
    <p id="endMsg"></p>
    <button class="big-btn primary" id="btnAgain">🔁 再来一次</button>
    <button class="big-btn" id="btnHomeEnd">🏠 回家</button>
  </div>
</section>

<div id="confettiLayer"></div>

<!-- 家长中心 -->
<div class="modal hidden" id="parentModal">
  <div class="modal-card">
    <div class="modal-head"><span>⚙️ 家长中心</span><button class="icon-btn" id="parentClose" aria-label="关闭">✖️</button></div>
    <div class="modal-body">
      <div>
        <div class="set-title">🗣️ 朗读人声 <small style="color:#b09a7d;">（逐个试听，选最清楚的那个）</small></div>
        <div class="seg" id="segVoice"></div>
        <p class="voice-note" id="voiceNote"></p>
      </div>
      <div>
        <div class="set-title">🎙️ 朗读速度 <button class="seg-btn" id="btnVoiceTest">🔊 试听</button></div>
        <div class="seg" id="segRate">
          <button class="seg-btn" data-v="slow">慢一些</button>
          <button class="seg-btn" data-v="normal">标准</button>
          <button class="seg-btn" data-v="fast">快一些</button>
        </div>
      </div>
      <div>
        <div class="set-title">🖼️ 选项图片提示</div>
        <div class="seg" id="segHints">
          <button class="seg-btn" data-v="1">显示图片</button>
          <button class="seg-btn" data-v="0">只看汉字</button>
        </div>
        <p class="voice-note">入门时显示图片帮助联想；孩子熟悉后可切到「只看汉字」真正考认字。</p>
      </div>
      <div>
        <div class="set-title">🎯 每轮题数</div>
        <div class="seg" id="segLen">
          <button class="seg-btn" data-v="5">5 题</button>
          <button class="seg-btn" data-v="10">10 题</button>
          <button class="seg-btn" data-v="15">15 题</button>
        </div>
        <p class="voice-note">3 岁半建议 5～10 题，一局 2～3 分钟刚好。</p>
      </div>
      <div>
        <div class="set-title">📊 学习进度</div>
        <div id="progressList" style="margin-top:8px;"></div>
      </div>
      <button class="danger" id="resetBtn">🗑 重置全部进度</button>
    </div>
  </div>
</div>

<script src="data.js"></script>
<script src="game.js"></script>
</body>
</html>
